<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/phone.css" media="(max-width: 768px)">
    <link rel="icon" href="../img/Icon.ico">
    <title>星引擎随机工具</title>
</head>
<body>
    <div class="Center-Container">
        <div class="Random-Container">
            <span class="Title-Text">星引擎随机角色</span>
            <div class="Character-Container">
                <div id="Character-Container">
                    <!--Here is the characters-->
                    <div class="Character">
                        <img class="Character-Img" alt="">
                        <span class="characterText">您的座次为一号位</span>
                        <span class="characterText Player-Character">暂无角色</span>
                    </div>
                    <div class="Character">
                        <img class="Character-Img" alt="">
                        <span class="characterText">您的座次为二号位</span>
                        <span class="characterText Player-Character">暂无角色</span>
                    </div>
                    <div class="Character">
                        <img class="Character-Img" alt="">
                        <span class="characterText">您的座次为三号位</span>
                        <span class="characterText Player-Character">暂无角色</span>
                    </div>
                    <div class="Character">
                        <img class="Character-Img" alt="">
                        <span class="characterText">您的座次为四号位</span>
                        <span class="characterText Player-Character">暂无角色</span>
                    </div>
                </div>
            </div>
            <div class="Button" id="Start-Button">点击开始随机角色</div>
            <span id="Last-Record-Text">上次的结果：</span>
            <div id="Last-Character-Record">
                
            </div>
        </div>
        <div class="Random-Container">
            <span class="Title-Text">星引擎随机地图</span>
            <div class="Map-Container">
                <img src="https://patchwiki.biligame.com/images/starengine/b/bb/b11cjjrs51ai0xhzsfwka79m9drer3k.png" alt="">
                <span class="mapText">本次随机到的地图为：</span>
            </div>
            <div class="Button" id="Start-Map-Button">点击开始随机地图</div>
        </div>
    </div>
    <div class="watermark-Box">
        <div class="watermark">页面提供人:</div>
        <div class="watermark">Shichigatsu_Yuki(9aQ7xpm)</div>
        <div class="watermark">Version: 0.5.0</div>
    </div>
    <div id="ChangeBackground-Button">切换<br>背景</div>
    <script src="./js/random.js"></script>
    <script src="./js/random-map.js"></script>
    <script src="./js/background.js"></script>
    <script src="./js/page.js"></script>
    <script src="./js/alert.js"></script>
</body>
</html>
