    <script>
        new spine.SpinePlayer("player-container", {
            skelUrl: "./Art_13020001/SpineHandCard_13020001/SpineHandCard_13020001.skel",
            atlasUrl: "./Art_13020001/SpineHandCard_13020001/SpineHandCard_13020001.atlas",
            showControls: false,
            alpha: true,
            backgroundColor: "#00000000",
            showContents: true,
            success: function (player) {
                var names = player.skeleton.data.animations.map(function (a) { return a.name; });
                console.log("可用的动画名：", names);
                if (names.length > 0) {
                    player.setAnimation(names[0]);
                }
                var slot = player.skeleton.findSlot("你的光效插槽名");
                if (slot) {
                    slot.color.a = 1;
                    var attachment = player.skeleton.getAttachment(slot.data.index, "附件名");
                    if (attachment) {
                        slot.setAttachment(attachment);
                    }
                }
            }
        });
    </script>
