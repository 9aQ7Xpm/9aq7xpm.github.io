<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>假日福利</title>
    <link rel="icon" type="image/x-icon" href="../img/Icon.ico">
</head>
<body>
    <style>
        .ActBingoWrapper {
            zoom: 0.6;
            display: flex;
            position: relative;
            min-width: 1032px;
            min-height: 918px;
            background-repeat: no-repeat;
            background-image:url('https://patchwiki.biligame.com/images/starengine/8/86/jw5hwbx2xi2bd5u00k4pwsq7bjew3mr.png');
        }
        .ActBingo-Map {
            display: flex;
            position: absolute;
            zoom: 1.1;
            left: 30px;
            width: 627px;
            height: 613px;
            background-image: url('https://patchwiki.biligame.com/images/starengine/9/98/0g775c33l5egsmf2l45o7w4w71ebe7a.png');
        }
        .ActBingo-CellsWrapper {
            position: absolute;
            zoom: 1.1;
            left: 75px;
            top: 100px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 60px;
            grid-auto-rows: 1fr;
        }
        .BingoCells {
            display: flex;
            width: 100px;
            height: 100px;
            justify-content: center;
            align-items: center;
            background-repeat: no-repeat;
            background-image: url('https://patchwiki.biligame.com/images/starengine/6/60/h4bqp2kjtmju6tk147ji0ccmug5e0tk.png');
            background-size: 100px 100px;
        }
        #CellsTxt {
            display: flex;
            zoom:0.9;
            position: absolute;
            top: 26px;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 130%;
            -webkit-text-stroke: 1px black;
            background-color: #FF1794;
            width: 150px;
            height: 40px;
            border: 5px black solid;
            border-radius: 50px;
            font-family: '荆南波波黑';
        }
        #CellsTxt:hover {
            background-color: #86FC00;
        }
        #CellsTxt:active {
            transform: scale(0.9);
        }
    </style>
    <div class="ActBingoWrapper">
        <div class="ActBingo-Map">
            <span id="CellsTxt">切换进度</span>
            <div class="ActBingo-CellsWrapper">

            </div>
        </div>
    </div>
</body>
<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="./script.js"></script>
</html>
